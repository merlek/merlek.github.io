<nav id="menu" aria-label="Main navigation" class="navbar fixed-top navbar-expand-md navbar-dark">
  <a class="navbar-brand" routerLink="/home">
    <span class="brand-mark" aria-hidden="true">mk<span>.</span></span>
    <span class="brand-name">{{ title }}</span>
  </a>
  <button
    class="navbar-toggler"
    type="button"
    (click)="isCollapsed = !isCollapsed"
    [attr.aria-expanded]="!isCollapsed"
    aria-controls="navbarSupportedContent"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>
  <div
    [ngbCollapse]="isCollapsed"
    class="collapse navbar-collapse"
    id="navbarSupportedContent"
  >
    <ul class="navbar-nav me-auto">
      <li
        *ngFor="let nav of navs"
        ngbDropdown
        [class.dropdown]="nav.children"
        class="nav-item"
        [routerLinkActive]="['active']"
      >
        <a
          *ngIf="!nav.children"
          class="nav-link"
          (click)="isCollapsed = true"
          routerLink="/{{ nav.path }}"
          >{{ nav.name }}</a
        >
        <a
          *ngIf="nav.children"
          ngbDropdownToggle
          class="nav-link"
          id="{{ nav.path }}"
          role="button"
          data-toggle="dropdown"
          aria-haspopup="true"
          aria-expanded="false"
          >{{ nav.name }}</a
        >
        <div
          ngbDropdownMenu
          class="dropdown-menu"
          [attr.aria-labelledby]="nav.path"
        >
          <a
            *ngFor="let child of nav.children"
            class="dropdown-item"
            [routerLinkActive]="['active']"
            (click)="isCollapsed = true"
            routerLink="/{{ nav.path }}/{{ child.path }}"
            >{{ child.name }}</a
          >
        </div>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/resume" (click)="isCollapsed = true">Resume</a>
      </li>
    </ul>
  </div>
</nav>
