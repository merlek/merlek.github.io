<div class="card">
  <button type="button" class="btn btn-primary btn-lg w-100" (click)="isCollapsed = !isCollapsed" [attr.aria-expanded]="!isCollapsed"
    aria-controls="collapseExample">
    Lamed-Heh
  </button>
  <div class="card-body" id="collapseExample" [ngbCollapse]="isCollapsed">
    <tabset class="text-center" [justified]="true">
      <tab id="sufformative-rules">
        <ng-template tabHeading>
          <h6>Sufformative Rules</h6>
        </ng-template>

          <div class="pt-3">
            <tabset class="text-center" [justified]="true">
              <tab id="no-sufformative">
                <ng-template tabHeading>
                  <h6>No Sufformative</h6>
                </ng-template>

                  <app-no-sufformative></app-no-sufformative>

              </tab>
              <tab id="consonantal-sufformative">
                <ng-template tabHeading>
                  <h6>Consonantal Sufformative</h6>
                </ng-template>

                  <app-consonantal-sufformative></app-consonantal-sufformative>

              </tab>
              <tab id="vocalic-sufformative">
                <ng-template tabHeading>
                  <h6>Vocalic Sufformative</h6>
                </ng-template>

                  <app-vocalic-sufformative></app-vocalic-sufformative>

              </tab>
            </tabset>
          </div>

      </tab>
      <tab id="anomalies">
        <ng-template tabHeading>
          <h6>Anomalies</h6>
        </ng-template>

          <app-sewa></app-sewa>

      </tab>
    </tabset>
  </div>
</div>
