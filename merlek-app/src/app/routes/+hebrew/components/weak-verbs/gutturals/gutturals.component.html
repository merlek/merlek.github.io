<div class="card">
  <button type="button" class="btn btn-primary btn-lg w-100" (click)="isCollapsed = !isCollapsed" [attr.aria-expanded]="!isCollapsed"
    aria-controls="collapseExample">
    Gutturals
  </button>
  <div class="card-body" id="collapseExample" [ngbCollapse]="isCollapsed">
    <tabset class="text-center" [justified]="true">
      <tab id="dagesh-forte">
        <ng-template tabHeading>
          <h6>Dagesh Forte</h6>
        </ng-template>

          <app-dagesh-forte></app-dagesh-forte>

      </tab>
      <tab id="sewa">
        <ng-template tabHeading>
          <h6>Sewa</h6>
        </ng-template>

          <app-sewa></app-sewa>

      </tab>
      <tab id="a-class">
        <ng-template tabHeading>
          <h6>A-class Environment</h6>
        </ng-template>

          <app-a-class></app-a-class>

      </tab>
    </tabset>
  </div>
</div>
